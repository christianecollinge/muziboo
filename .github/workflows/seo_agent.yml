name: Generate Daily SEO Blog Posts

on:
  schedule:
    - cron: "30 4 * * *" # Runs daily at 5:30 AM CET (04:30 UTC)
  workflow_dispatch: # Allows manual trigger from UI

permissions:
  contents: write
  issues: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Verify Environment
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ Error: GEMINI_API_KEY is not set in repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.DATAFORSEO_LOGIN }}" ] || [ -z "${{ secrets.DATAFORSEO_PASSWORD }}" ]; then
            echo "⚠️ Warning: DataForSEO credentials are missing. Falling back to static keywords."
          fi

      - name: Run SEO Agent Generator
        id: seo_gen
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run seo:generate

      - name: Notify on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ SEO Agent Automation Failed" \
            --body "The daily SEO blog generation failed on $(date). Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "bug,automation"

      - name: Commit and Push New Posts
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ scripts/

          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: automated SEO blog generation"
            git push
          else
            echo "No new blog posts generated today."
          fi
