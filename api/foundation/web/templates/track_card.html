{{define "track_card"}}
<div class="group rounded-xl overflow-hidden bg-muziboo-bg-softer border border-muziboo-border hover:border-muziboo-gold/40 transition-all duration-300">
    <!-- Artwork -->
    <div class="relative aspect-square overflow-hidden cursor-pointer"
         onclick="playTrack('{{.AudioURL}}', '{{.Title}}', '{{.ArtistName}}')">
        {{if .ArtworkURL}}
        <img src="{{.ArtworkURL}}" alt="{{.Title}} artwork"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />
        {{else}}
        <div class="w-full h-full bg-gradient-to-br from-muziboo-bar-1/30 via-muziboo-bar-3/30 to-muziboo-bar-5/30 flex items-center justify-center">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-muziboo-text-muted/40">
                <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
            </svg>
        </div>
        {{end}}
        <!-- Play overlay -->
        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-colors duration-300 flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-muziboo-gold text-muziboo-bg flex items-center justify-center opacity-0 group-hover:opacity-100 transform scale-90 group-hover:scale-100 transition-all duration-300 shadow-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21" /></svg>
            </div>
        </div>
        {{if .Genre}}
        <span class="absolute top-3 left-3 px-2.5 py-1 text-xs font-medium rounded-full bg-black/60 text-muziboo-text backdrop-blur-sm">{{.Genre}}</span>
        {{end}}
    </div>
    <!-- Info -->
    <div class="p-4">
        <div class="flex items-start justify-between gap-2 mb-1">
            <h3 class="font-semibold text-muziboo-text truncate flex-1">{{.Title}}</h3>
            <!-- Upvote Button -->
            <button id="vote-btn-{{.ID}}" 
                    onclick="event.stopPropagation(); handleVote('{{.ID}}', this)"
                    data-voted="{{.HasVoted}}"
                    hx-boost="false"
                    class="flex flex-col items-center justify-center min-w-[40px] px-2 py-1 rounded-lg border transition-all {{if .HasVoted}}bg-muziboo-gold/10 border-muziboo-gold text-muziboo-gold{{else}}bg-muziboo-bg border-muziboo-border text-muziboo-text-muted hover:border-muziboo-gold/50{{end}}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m18 15-6-6-6 6"/>
                </svg>
                <span class="text-xs font-bold mt-0.5">{{.VoteCount}}</span>
            </button>
        </div>
        
        {{if .ArtistName}}
        <a href="/app/user/{{.ArtistUsername}}" class="flex items-center gap-2 group/artist mb-3">
            <div class="w-5 h-5 rounded-full bg-muziboo-gold/20 flex items-center justify-center">
                <span class="text-xs text-muziboo-gold font-medium">{{slice .ArtistName 0 1}}</span>
            </div>
            <span class="text-sm text-muziboo-text-muted group-hover/artist:text-muziboo-gold transition-colors truncate">{{.ArtistName}}</span>
        </a>
        {{end}}

        <div class="flex items-center justify-between mt-auto">
            <span class="text-[10px] uppercase tracking-wider text-muziboo-text-muted/60 font-medium">{{.TimeAgo}}</span>
            <div class="flex items-center gap-3">
                <!-- Comments Count Link -->
                <a href="/app/tracks/{{.ID}}" class="flex items-center gap-1 text-muziboo-text-muted hover:text-muziboo-text transition-colors">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="text-xs">{{.CommentCount}}</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
if (typeof handleVote === 'undefined') {
    window.handleVote = async function(trackId, btn) {
        const token = await getToken();
        if (!token) { window.location.href = '/app/login'; return; }

        const originalHtml = btn.innerHTML;
        const isVoted = btn.getAttribute('data-voted') === 'true';
        
        try {
            const res = await fetch(`/api/tracks/${trackId}/vote`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (!res.ok) throw new Error('Vote failed');
            
            const data = await res.json();
            
            // Update UI
            const countEl = btn.querySelector('span');
            countEl.textContent = data.count;
            
            if (data.active) {
                btn.classList.add('bg-muziboo-gold/10', 'border-muziboo-gold', 'text-muziboo-gold');
                btn.classList.remove('bg-muziboo-bg', 'border-muziboo-border', 'text-muziboo-text-muted');
                btn.setAttribute('data-voted', 'true');
            } else {
                btn.classList.remove('bg-muziboo-gold/10', 'border-muziboo-gold', 'text-muziboo-gold');
                btn.classList.add('bg-muziboo-bg', 'border-muziboo-border', 'text-muziboo-text-muted');
                btn.setAttribute('data-voted', 'false');
            }
        } catch (err) {
            console.error(err);
        }
    };
}
</script>
{{end}}
